[project]
name = "modal-inference-hub"
version = "1.0.0"
description = "Human experiment caller composing modal-2D-client and modal-3D-client"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
build = ["pyinstaller>=6.16,<7"]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
