[project]
name = "modal-3d-client-agent"
version = "0.4.1"
description = "Local agent for modal-3D Client"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "modal[api-proxy-support]",
    "pillow>=11,<13",
    "pydantic",
    "python-multipart",
    "onnxruntime>=1.23.2,<1.26; sys_platform == 'darwin'",
    "onnxruntime-gpu>=1.23.2,<1.26; sys_platform != 'darwin'",
    "rembg>=2.0.70,<3",
    "scipy>=1.12,<2",
    "uvicorn",
]

[dependency-groups]
build = [
    "pyinstaller>=6.16,<7",
]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
