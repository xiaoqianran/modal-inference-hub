[project]
name = "modal-3d-client-agent"
version = "0.4.1"
description = "Local agent for modal-3D Client"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "modal[api-proxy-support]",
    "pydantic",
    "python-multipart",
    "uvicorn",
]

[dependency-groups]
build = [
    "pyinstaller>=6.16,<7",
]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
