[project]
name = "modal-inference-hub"
version = "0.5.0"
description = "Local inference hub composing modal-2D and modal-3D workflows"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "modal[api-proxy-support]",
    "pillow>=11,<13",
    "pydantic",
    "python-multipart",
    "onnxruntime-gpu>=1.24,<1.25; sys_platform == 'win32'",
    "onnxruntime>=1.23.2,<1.26; sys_platform != 'win32'",
    "scipy>=1.12,<2",
    "uvicorn",
]

[dependency-groups]
build = [
    "pyinstaller>=6.16,<7",
]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
