name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: 安装项目依赖
        run: |
          npm ci
          uv python install 3.12
          uv sync --locked --group dev --group build

      - name: 构建并冒烟测试本地代理
        shell: pwsh
        run: ./scripts/build-agent.ps1

      - name: 验证源码
        run: |
          npm run build
          npm test
          uv run python -m compileall -q hub agent
          uv run ruff check hub agent tests
          uv run pytest -q
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: 构建 Windows 安装包
        run: npm run desktop:build:release

      - name: 发布 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe,
                          src-tauri/target/release/bundle/msi/*.msi
          )
          if ($assets.Count -lt 2) { throw "预期生成 NSIS 和 MSI 两个安装包。" }

          $checksumPath = Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt"
          $checksums = $assets | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content -Path $checksumPath -Value $checksums -Encoding ascii

          $releaseAssets = @($assets.FullName) + @($checksumPath)
          gh release create $env:GITHUB_REF_NAME @releaseAssets `
            --verify-tag `
            --title "Modal Inference Hub $env:GITHUB_REF_NAME" `
            --notes "Windows 实验工作台：通过独立 modal-2D-client 与 modal-3D-client 组合人工 Text→2D→3D 流程。安装包尚未签名，首次启动时 Windows SmartScreen 可能显示警告。"
