name: Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: astral-sh/setup-uv@v10.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Frontend
        run: npm ci

      - name: Python agent
        run: |
          uv python install 3.12
          uv sync --upgrade-package modal
          uv run python -m compileall -q agent
          uv run python -c "import modal; print('modal', modal.__version__)"

      - name: Build and smoke agent EXE
        shell: pwsh
        run: |
          ./scripts/build-agent.ps1
          ./scripts/smoke-agent.ps1

      - name: Tauri checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: modal-3D-client-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
