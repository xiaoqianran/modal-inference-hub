<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181b24" />
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #181b24; }
      body { font-family: Inter, "Segoe UI", system-ui, sans-serif; }
      #startup {
        min-height: 100vh; display: grid; place-items: center; color: #eef1f7;
        background: radial-gradient(circle at 50% 36%, #252b3a 0, #181b24 48%, #141720 100%);
      }
      .startup-card { display: grid; justify-items: center; gap: 14px; text-align: center; }
      .startup-mark {
        width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
        border: 1px solid #58657e; background: #202633; font-weight: 700; letter-spacing: -1px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, .24);
      }
      .startup-card strong { font-size: 15px; font-weight: 600; }
      .startup-card span { color: #aab2c3; font-size: 12px; }
      .startup-progress { width: 132px; height: 2px; overflow: hidden; border-radius: 999px; background: #303748; }
      .startup-progress::after {
        content: ""; display: block; width: 42%; height: 100%; border-radius: inherit; background: #9eb6ff;
        animation: startup-slide 1.15s ease-in-out infinite alternate;
      }
      @keyframes startup-slide { from { transform: translateX(0); } to { transform: translateX(184%); } }
      @media (prefers-reduced-motion: reduce) { .startup-progress::after { animation: none; width: 100%; opacity: .7; } }
    </style>
    <meta name="description" content="组合 Modal 2D 与 3D Sidecar 的人工实验工作台" />
    <title>Modal Inference Hub</title>
  </head>

  <body>
    <div id="root">
      <div id="startup" role="status" aria-live="polite">
        <div class="startup-card">
          <div class="startup-mark">MI</div>
          <strong>正在启动 Modal Inference Hub</strong>
          <span>正在准备实验工作区</span>
          <div class="startup-progress" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
