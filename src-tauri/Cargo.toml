[package]
name = "modal-inference-hub"
version = "1.0.0"
description = "Human experiment caller for Modal 2D and 3D"
authors = ["xiaoqianran"]
edition = "2021"

[lib]
name = "modal_inference_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rand = "0.9"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
